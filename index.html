<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موتارجي - منصة السيارات</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- رأس الصفحة -->
        <header class="header">
            <h1>موتارجي</h1>
            <p>منصة شراء وبيع السيارات الحديثة</p>
            <div id="userPanel">
                <span id="welcomeUser"></span>
                <button id="loginBtn">تسجيل الدخول</button>
                <button id="logoutBtn" class="hidden">خروج</button>
                <select id="langSelect">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>

        <!-- نافذة تسجيل الدخول -->
        <div id="loginModal" class="modal">
            <div class="modal-content">
                <span class="close" id="closeLogin">&times;</span>
                <h2>تسجيل الدخول</h2>
                <form id="loginForm">
                    <input type="text" id="username" placeholder="اسم المستخدم" required>
                    <input type="password" id="password" placeholder="كلمة المرور" required>
                    <button type="submit">دخول</button>
                </form>
                <p>أو <span id="showRegister">سجل الآن</span></p>
            </div>
        </div>

        <!-- نافذة تسجيل جديد -->
        <div id="registerModal" class="modal">
            <div class="modal-content">
                <span class="close" id="closeRegister">&times;</span>
                <h2>تسجيل جديد</h2>
                <form id="registerForm">
                    <input type="text" id="regUsername" placeholder="اسم المستخدم" required>
                    <input type="password" id="regPassword" placeholder="كلمة المرور" required>
                    <button type="submit">تسجيل</button>
                </form>
            </div>
        </div>

        <!-- قائمة تنقل -->
        <nav>
            <button id="showCarsBtn">السيارات</button>
            <button id="showSellFormBtn">بيع سيارتك</button>
            <input type="text" id="searchInput" placeholder="بحث عن سيارة...">
            <select id="filterBrand">
                <option value="">كل الماركات</option>
                <option value="تويوتا">تويوتا</option>
                <option value="هوندا">هوندا</option>
                <option value="مرسيدس">مرسيدس</option>
            </select>
        </nav>

        <!-- قسم عرض السيارات -->
        <section id="carsSection" class="cars-grid"></section>

        <!-- قسم نموذج البيع -->
        <section id="sellFormSection" class="hidden">
            <h2>أضف سيارتك للبيع</h2>
            <form id="sellForm">
                <input type="text" id="carName" placeholder="اسم السيارة" required>
                <input type="number" id="carYear" placeholder="سنة الصنع" required>
                <input type="number" id="carPrice" placeholder="السعر بالدج" required>
                <input type="text" id="carBrand" placeholder="الماركة" required>
                <input type="text" id="carImage" placeholder="رابط صورة السيارة">
                <button type="submit">إضافة السيارة</button>
            </form>
        </section>

        <footer class="footer">
            <p>جميع الحقوق محفوظة &copy; 2025 - موتارجي</p>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
