<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>موتارجي - بيع وشراء السيارات</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        header {
            background: #1a73e8;
            padding: 15px;
            color: #fff;
            text-align: center;
            font-size: 24px;
        }
        .container {
            padding: 20px;
        }
        .actions {
            margin-top: 20px;
            text-align: center;
        }
        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #actionResult {
            margin-top: 15px;
            font-size: 18px;
            color: #333;
        }
        footer {
            text-align: center;
            padding: 10px;
            margin-top: 30px;
            background: #eee;
            color: #555;
        }
    </style>
</head>
<body>

<header>
    تطبيق موتارجي
</header>

<div class="container">
    <h2>آخر السيارات المعروضة</h2>
    <p>مرحباً بك في منصة موتارجي. يمكنك الآن شراء وبيع السيارات بسهولة.</p>

    <div class="actions">
        <button id="buyBtn">شراء</button>
        <button id="sellBtn">بيع</button>
        <p id="actionResult"></p>
    </div>
</div>

<footer>
    &copy; 2025 موتارجي
</footer>

<script>
    // كود المرحلة العاشرة
    document.getElementById("buyBtn").addEventListener("click", () => {
        document.getElementById("actionResult").innerText = "📌 تم تنفيذ عملية الشراء";
    });

    document.getElementById("sellBtn").addEventListener("click", () => {
        document.getElementById("actionResult").innerText = "📌 تم تنفيذ عملية البيع";
    });
</script>

</body>
</html>
