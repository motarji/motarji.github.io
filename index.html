<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موتارجي - بيع وشراء السيارات</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="https://via.placeholder.com/32x32?text=M">
</head>
<body>
    <!-- رأس الصفحة -->
    <header>
        <div class="logo">موتارجي</div>
        <nav>
            <ul>
                <li><a href="#home">الرئيسية</a></li>
                <li><a href="#cars">السيارات</a></li>
                <li><a href="#about">حول</a></li>
                <li><a href="#contact">اتصل بنا</a></li>
            </ul>
        </nav>
        <div class="lang-login">
            <button id="langBtn">EN/عربي</button>
            <button id="loginBtn">تسجيل الدخول</button>
        </div>
    </header>

    <!-- الصفحة الرئيسية -->
    <section id="home" class="hero">
        <h1>مرحباً بك في منصة موتارجي</h1>
        <p>يمكنك الآن شراء وبيع السيارات بسهولة وسرعة.</p>
        <div class="hero-buttons">
            <button class="buy-btn">شراء</button>
            <button class="sell-btn">بيع</button>
        </div>
    </section>

    <!-- قائمة السيارات -->
    <section id="cars" class="cars-section">
        <h2>أحدث السيارات المعروضة</h2>
        <div class="cars-container" id="carsContainer">
            <!-- سيتم تعبئة السيارات هنا بواسطة main.js -->
        </div>
    </section>

    <!-- قسم حول -->
    <section id="about" class="about-section">
        <h2>حول موتارجي</h2>
        <p>منصة رائدة في بيع وشراء السيارات في الجزائر. نضمن لك تجربة سلسة وآمنة.</p>
    </section>

    <!-- قسم الاتصال -->
    <section id="contact" class="contact-section">
        <h2>اتصل بنا</h2>
        <form id="contactForm">
            <input type="text" placeholder="اسمك" required>
            <input type="email" placeholder="البريد الإلكتروني" required>
            <textarea placeholder="رسالتك" required></textarea>
            <button type="submit">إرسال</button>
        </form>
    </section>

    <!-- تذييل الصفحة -->
    <footer>
        <p>&copy; 2025 موتارجي. جميع الحقوق محفوظة.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
